services:
  postgres:
    image: postgres:16-alpine
    container_name: transaksi-postgres
    environment:
      POSTGRES_DB: transaksi_db
      POSTGRES_USER: transaksi
      POSTGRES_PASSWORD: transaksi_rahasia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
